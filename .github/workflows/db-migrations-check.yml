name: db-migrations-check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrations-check.yml"
      - ".github/workflows/db-check.yml" # cobre o antigo, caso ainda exista

permissions:
  contents: read

jobs:
  check:
    # só roda em PRs que NÃO são de fork
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Instala Supabase CLI (sem curl/tar)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: supabase --version

      # Se o secret não existir, só escreve um aviso e sai com sucesso
      - name: Verify migrations (dry-run)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "⏭️  Pulando verificação de migrações: **SUPABASE_DB_URL** não está definido." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Defina o secret **SUPABASE_DB_URL** nos secrets do repositório para habilitar este check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  # Mensagem amigável para PRs vindos de fork (sem secrets)
  skip-fork:
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Skipped on forks (no secrets available)
        run: |
          echo "⚠️ Este PR veio de um fork, então os *secrets* não ficam disponíveis para o workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Para rodar o check de migrações, abra o PR a partir de um branch no repositório principal **ou** peça para um maintainer reexecutar o workflow." >> "$GITHUB_STEP_SUMMARY"
