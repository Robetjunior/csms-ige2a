services:
  postgres:
    image: postgres:15
    container_name: csms_postgres
    environment:
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: csms
      POSTGRES_DB: csms
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csms || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  mariadb:
    image: mariadb:10.6
    container_name: csms_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: steve
      MARIADB_USER: steve
      MARIADB_PASSWORD: steve
      TZ: UTC
    command:
      - mysqld
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ./.data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -usteve -p$MARIADB_PASSWORD -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  steve:
    image: eclipse-temurin:17-jre
    container_name: csms_steve
    depends_on:
      mariadb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./services/tools/steve:/app
      - ./.logs/steve:/app/logs
    command:
      - java
      - -Duser.home=/app
      - -DLOG_DIR=/app/logs
      - -Dlogback.configurationFile=/app/logback.xml
      - -Dspring.config.location=/app/steve.properties
      - -Dsteve.config=/app/steve.properties
      - -Dsteve.config.location=/app/steve.properties
      - -cp
      - steve.jar:lib/*
      - de.rwth.idsg.steve.Application
    environment:
      TZ: UTC
      STEVE_DB_URL: jdbc:mariadb://mariadb:3306/steve
      STEVE_DB_USER: steve
      STEVE_DB_PASS: steve
      # Limita o heap da JVM para ~300–500 MiB de uso:
      # Xms = 256m (inicial), Xmx = 512m (máximo)
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    ports:
      - "8180:8180"
    restart: unless-stopped
    mem_limit: 600m     # folga para heap + overhead da JVM
    cpus: 1.5

  orchestrator:
    image: node:20-alpine
    container_name: csms_orchestrator
    working_dir: /app
    volumes:
      - ./services/orchestrator-api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      TZ: UTC
      PORT: "3000"
      POSTGRES_URI: postgresql://csms:csms@postgres:5432/csms
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: steve
      MARIADB_PASSWORD: steve
      MARIADB_DATABASE: steve
      CHOKIDAR_USEPOLLING: "true"  
      ORCH_API_KEY: minha_chave_super_secreta
    command: >
      sh -lc "corepack enable &&
              corepack prepare pnpm@10.14.0 --activate &&
              pnpm install &&
              pnpm dev"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0

  # Monitoramento de containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: csms_cadvisor
    ports:
      - "18081:8080"   # evita conflito com serviços que usam 8080
    volumes:
      # Montagens padrão recomendadas pelo projeto
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # Coletor de métricas (scrape do cAdvisor e de si próprio)
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: csms_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.data/prometheus:/prometheus
    depends_on:
      - cadvisor
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  # Visualização (dashboards)
  grafana:
    image: grafana/grafana:11.1.4
    container_name: csms_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      TZ: UTC
    volumes:
      - ./.data/grafana:/var/lib/grafana
      # Se quiser provisionar datasources/dashboards automáticos, monte:
      # - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
