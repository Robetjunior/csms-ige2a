services:
  orchestrator:
    image: node:20-alpine
    container_name: csms_orchestrator
    working_dir: /app

    volumes:
      - ./services/orchestrator-api:/app
      - /app/node_modules
      # (remova se nÃ£o usa CA corporativo)
      # - ./certs/corp-ca.crt:/usr/local/share/ca-certificates/corp-ca.crt:ro

    dns:
      - 1.1.1.1
      - 8.8.8.8

    # carrega variÃ¡veis do serviÃ§o (inclui SUPABASE_URL/KEY e POSTGRES_URI)
    env_file:
      - ./services/orchestrator-api/.env

    environment:
      NODE_ENV: development
      TZ: UTC
      PORT: "3000"
      PG_POOL_MAX: "10"
      # Descomente somente se precisar desligar verificaÃ§Ã£o de certificado (nÃ£o recomendado)

      # Engine OCPP (placeholder)
      OCPP_ENGINE_KIND: mock
      OCPP_ENGINE_URL: ""

      # Dev
      CHOKIDAR_USEPOLLING: "true"
      ORCH_API_KEY: ${ORCH_API_KEY:-minha_chave_super_secreta}
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    command: >
      sh -lc "apk add --no-cache ca-certificates &&
              update-ca-certificates &&
              corepack enable &&
              corepack prepare pnpm@10.14.0 --activate &&
              pnpm install &&
              pnpm dev"

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: csms_cadvisor
    ports:
      - "18081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: csms_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./.data/prometheus:/prometheus
    depends_on:
      - cadvisor
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  grafana:
    image: grafana/grafana:11.1.4
    container_name: csms_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      TZ: UTC
    volumes:
      - ./.data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5


