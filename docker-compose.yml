services:
  orchestrator:
    image: node:20-alpine
    container_name: csms_orchestrator
    working_dir: /app
    volumes:
      - ./services/orchestrator-api:/app
      - /app/node_modules
      # - ./certs/corp-ca.crt:/usr/local/share/ca-certificates/corp-ca.crt:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8

    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      TZ: UTC
      PORT: "3000"
      PG_POOL_MAX: "10"
      PG_SSL_REJECT_UNAUTHORIZED: "0"
      PG_FORCE_IPV4: "0"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      OCPP_ENGINE_KIND: mock
      OCPP_ENGINE_URL: ""
      CHOKIDAR_USEPOLLING: "true"
      DASHBOARD_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://localhost:5173,http://localhost:8084,http://127.0.0.1:8084,https://localhost:8084,http://localhost:8086,http://localhost:8087,http://localhost:8081,http://127.0.0.1:8081"
      ORCH_API_KEY: ${ORCH_API_KEY:-minha_chave_super_secreta}
      DISABLE_DB_ONLINE: "1"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    command: >
      sh -lc "apk add --no-cache ca-certificates &&
              update-ca-certificates &&
              corepack enable &&
              corepack prepare pnpm@10.14.0 --activate &&
              pnpm install &&
              pnpm dev"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/metrics > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0

  # mobile service removido: o app tem repositório próprio e não deve subir via compose deste repo

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: csms_cadvisor
    ports:
      - "18081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: csms_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./.data/prometheus:/prometheus
    depends_on:
      - cadvisor
      - orchestrator
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  grafana:
    image: grafana/grafana:11.1.4
    container_name: csms_grafana
    user: "0"  # evita problemas de permissão no Windows/WSL2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
      GF_PATHS_DATA: /var/lib/grafana
      TZ: UTC
    volumes:
      - ./.data/grafana:/var/lib/grafana
      # habilite se você criar os arquivos de provisioning (seção 3)
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
