services:
  postgres:
    image: postgres:15
    container_name: csms_postgres
    profiles: ["dev"]
    environment:
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: csms
      POSTGRES_DB: csms
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csms || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  mariadb:
    image: mariadb:10.6
    container_name: csms_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: steve
      MARIADB_USER: steve
      MARIADB_PASSWORD: steve
      TZ: UTC
    command:
      - mysqld
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ./.data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -usteve -p$MARIADB_PASSWORD -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  steve:
    image: eclipse-temurin:17-jre
    container_name: csms_steve
    depends_on:
      mariadb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./services/tools/steve:/app
      - ./.logs/steve:/app/logs
    command:
      - java
      - -Duser.home=/app
      - -DLOG_DIR=/app/logs
      - -Dlogback.configurationFile=/app/logback.xml
      - -Dspring.config.location=/app/steve.properties
      - -Dsteve.config=/app/steve.properties
      - -Dsteve.config.location=/app/steve.properties
      - -cp
      - steve.jar:lib/*
      - de.rwth.idsg.steve.Application
    environment:
      TZ: UTC
      STEVE_DB_URL: jdbc:mariadb://mariadb:3306/steve
      STEVE_DB_USER: steve
      STEVE_DB_PASS: steve
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    ports:
      - "8180:8180"
    restart: unless-stopped
    mem_limit: 600m
    cpus: 1.5

  orchestrator:
    image: node:20-alpine
    container_name: csms_orchestrator
    working_dir: /app
    volumes:
      - ./services/orchestrator-api:/app
      - /app/node_modules
      - ./certs/corp-ca.crt:/usr/local/share/ca-certificates/corp-ca.crt:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_ENV: development
      TZ: UTC
      PORT: "3000"

      # DSN principal para o pool do Postgres usado pelo repo.ts
      POSTGRES_URI: ${SUPABASE_DB_URL}
      PG_POOL_MAX: "10"

      # Ainda disponível se você usar o SDK HTTP do Supabase
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      PG_SSL_REJECT_UNAUTHORIZED: "0"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

      SUPABASE_URL: https://nctwaraezhmznwindnvn.supabase.co
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

      # SteVe (MariaDB)
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: steve
      MARIADB_PASSWORD: steve
      MARIADB_DATABASE: steve

      # HTTP
      CHOKIDAR_USEPOLLING: "true"
      ORCH_API_KEY: ${ORCH_API_KEY:-minha_chave_super_secreta}

      # Prioriza IPv4
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    command: >
      sh -lc "apk add --no-cache ca-certificates &&
              update-ca-certificates &&
              corepack enable &&
              corepack prepare pnpm@10.14.0 --activate &&
              pnpm install &&
              pnpm dev"
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: csms_cadvisor
    ports:
      - "18081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: csms_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./.data/prometheus:/prometheus
    depends_on:
      - cadvisor
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  grafana:
    image: grafana/grafana:11.1.4
    container_name: csms_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      TZ: UTC
    volumes:
      - ./.data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  caddy:
    image: caddy:2.7
    container_name: csms_edge
    restart: unless-stopped
    depends_on:
      - orchestrator
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./edge/data:/data
      - ./edge/config:/config