openapi: 3.0.3
info:
  title: Orchestrator API
  version: "1.0.0"
  description: >
    API para ingestão de eventos OCPP, comandos, consulta de sessões, métricas,
    tarifas e faturamento.
servers:
  - url: http://localhost:3000
    description: Local

tags:
  - name: Events
  - name: OCPP
  - name: Commands
  - name: Sessions
  - name: Metrics
  - name: Tariffs
  - name: Billing
  - name: Health

security:
  - ApiKeyAuth: []   # por padrão todas as rotas exigem X-API-Key

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []     # público
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /ready:
    get:
      tags: [Health]
      summary: Readiness check (inclui Postgres)
      security: []     # público
      responses:
        '200':
          description: OK
        '500':
          description: Banco indisponível

  # -------------------- Events --------------------
  /v1/events:
    get:
      tags: [Events]
      summary: Lista eventos
      parameters:
        - in: query
          name: event_type
          schema: { type: string }
        - in: query
          name: charge_box_id
          schema: { type: string }
        - in: query
          name: connector_pk
          schema: { type: integer, format: int32 }
        - in: query
          name: transaction_pk
          schema: { type: integer, format: int32 }
        - in: query
          name: id_tag
          schema: { type: string }
        - in: query
          name: from
          description: ISO 8601
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: ISO 8601
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'

  /v1/events/{id}:
    get:
      tags: [Events]
      summary: Busca evento por ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Não encontrado

  # -------------------- OCPP ingest --------------------
  /v1/ocpp/events:
    post:
      tags: [OCPP]
      summary: Ingestão de eventos OCPP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcppIngest'
            examples:
              start:
                value:
                  type: StartTransaction
                  transactionId: 9001
                  chargeBoxId: CB-01
                  idTag: ID-TEST
                  timestamp: "2025-08-21T12:00:00Z"
                  payload: { meterStart: 0 }
              stop:
                value:
                  type: StopTransaction
                  transactionId: 9001
                  reason: Remote
                  timestamp: "2025-08-21T12:15:00Z"
                  payload: { meterStop: 1200 }
      responses:
        '202':
          description: Aceito (novo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '200':
          description: Aceito (duplicado idempotente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'

  # -------------------- Commands --------------------
  /v1/commands:
    get:
      tags: [Commands]
      summary: Lista comandos
      parameters:
        - in: query
          name: transaction_id
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Lista de comandos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandSummary'

  /v1/commands/{id}:
    get:
      tags: [Commands]
      summary: Detalhe do comando
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Comando
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '404':
          description: Não encontrado

  /v1/commands/remoteStart:
    post:
      tags: [Commands]
      summary: RemoteStartTransaction (CSMS -> EVSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteStartRequest'
      responses:
        '202':
          description: Comando criado/enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '200':
          description: Idempotente (já havia comando ativo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentDuplicate'
        '400': { description: Payload inválido }
        '401': { description: Não autorizado }

  /v1/commands/remoteStop:
    post:
      tags: [Commands]
      summary: RemoteStopTransaction (CSMS -> EVSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteStopRequest'
      responses:
        '202':
          description: Comando criado/enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '200':
          description: Idempotente (já havia comando ativo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentDuplicate'
        '404': { description: Sessão não encontrada }
        '409': { description: Sessão já finalizada }

  # -------------------- Sessions --------------------
  /v1/sessions:
    get:
      tags: [Sessions]
      summary: Lista sessões
      parameters:
        - in: query
          name: charge_box_id
          schema: { type: string }
        - in: query
          name: id_tag
          schema: { type: string }
        - in: query
          name: transaction_id
          schema: { type: integer, format: int32 }
        - in: query
          name: status
          schema:
            type: string
            enum: [active, completed]
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de sessões
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'

  /v1/sessions/active/{chargeBoxId}:
    get:
      tags: [Sessions]
      summary: Sessão ativa por chargeBoxId
      parameters:
        - in: path
          name: chargeBoxId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sessão ativa ou null
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    oneOf:
                      - $ref: '#/components/schemas/Session'
                      - type: 'null'

  /v1/sessions/active/{chargeBoxId}/detail:
    get:
      tags: [Sessions]
      summary: Detalhe da sessão ativa (telemetria)
      parameters:
        - in: path
          name: chargeBoxId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sessão ativa com telemetria
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    oneOf:
                      - $ref: '#/components/schemas/Session'
                      - type: 'null'
                  telemetry:
                    type: object
                    nullable: true
                    properties:
                      kwh: { type: number, format: double }
                      power_kw: { type: number, format: double, nullable: true }
                      voltage_v: { type: number, format: double, nullable: true }
                      current_a: { type: number, format: double, nullable: true }
                      temperature_c: { type: number, format: double, nullable: true }
                      soc_percent_at: { type: integer, format: int32, nullable: true }

  /v1/sessions/{transactionId}:
    get:
      tags: [Sessions]
      summary: Detalhe da sessão por transactionId
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Não encontrado

  # -------------------- Metrics --------------------
  /v1/metrics:
    get:
      tags: [Metrics]
      summary: KPIs agregados da rede
      parameters:
        - in: query
          name: charge_box_id
          schema: { type: string, nullable: true }
        - in: query
          name: from
          schema: { type: string, format: date-time, nullable: true }
        - in: query
          name: to
          schema: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Resumo de métricas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'

  /v1/metrics/advanced:
    get:
      tags: [Metrics]
      summary: Séries temporais e métricas avançadas
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time, nullable: true }
        - in: query
          name: to
          schema: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Métricas avançadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsAdvanced'

  # -------------------- Tariffs --------------------
  /v1/tariffs:
    get:
      tags: [Tariffs]
      summary: Lista tarifas
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, draft, archived]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista de tarifas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TariffSummary' }
    post:
      tags: [Tariffs]
      summary: Cria uma nova tarifa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TariffUpsert' }
      responses:
        '201':
          description: Tarifa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }

  /v1/tariffs/{id}:
    get:
      tags: [Tariffs]
      summary: Detalhe da tarifa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Tarifa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '404': { description: Não encontrado }
    put:
      tags: [Tariffs]
      summary: Atualiza uma tarifa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TariffUpsert' }
      responses:
        '200':
          description: Tarifa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
    delete:
      tags: [Tariffs]
      summary: Remove (ou arquiva) uma tarifa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Removida }

  /v1/tariffs/preview:
    post:
      tags: [Tariffs]
      summary: Simula custo de uma sessão com uma tarifa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TariffPreviewRequest' }
      responses:
        '200':
          description: Resultado da simulação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffPreviewResponse' }

  # -------------------- Billing --------------------
  /v1/billing/invoices:
    get:
      tags: [Billing]
      summary: Lista de faturas
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [issued, paid, cancelled]
        - in: query
          name: charge_box_id
          schema: { type: string, nullable: true }
        - in: query
          name: from
          schema: { type: string, format: date-time, nullable: true }
        - in: query
          name: to
          schema: { type: string, format: date-time, nullable: true }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista de faturas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvoiceSummary' }

  /v1/billing/invoices/{id}:
    get:
      tags: [Billing]
      summary: Detalhe da fatura
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Fatura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { description: Não encontrado }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Ack:
      type: object
      properties:
        accepted: { type: boolean }
        idempotentDuplicate: { type: boolean }

    OcppIngest:
      type: object
      properties:
        type: { type: string }
        transactionId: { type: integer, format: int32, nullable: true }
        chargeBoxId: { type: string, nullable: true }
        idTag: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        timestamp: { type: string, format: date-time, nullable: true }
        payload:
          type: object
          additionalProperties: true
      required: [type, payload]

    Event:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        source: { type: string }
        event_type: { type: string }
        charge_box_id: { type: string, nullable: true }
        connector_pk: { type: integer, format: int32, nullable: true }
        transaction_pk: { type: integer, format: int32, nullable: true }
        id_tag: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true

    EventList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'

    CommandAccepted:
      type: object
      properties:
        commandId: { type: integer, format: int64 }
        status:
          type: string
          enum: [sent]
        message: { type: string }

    IdempotentDuplicate:
      type: object
      properties:
        commandId: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, sent, accepted]
        idempotentDuplicate: { type: boolean }

    RemoteStartRequest:
      type: object
      properties:
        chargeBoxId: { type: string }
        idTag: { type: string }
        connectorId: { type: integer, format: int32, nullable: true }
        reservationId: { type: integer, format: int32, nullable: true }
      required: [chargeBoxId, idTag]

    RemoteStopRequest:
      type: object
      properties:
        transactionId: { type: integer, format: int32 }
      required: [transactionId]

    CommandSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        command_type: { type: string }
        transaction_id: { type: integer, format: int32, nullable: true }
        charge_box_id: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, sent, accepted, completed, failed]
        created_at: { type: string, format: date-time }

    Command:
      allOf:
        - $ref: '#/components/schemas/CommandSummary'
        - type: object
          properties:
            payload:
              type: object
              additionalProperties: true
            response:
              type: object
              additionalProperties: true
            updated_at: { type: string, format: date-time, nullable: true }

    Session:
      type: object
      properties:
        transaction_id: { type: integer, format: int32 }
        charge_box_id: { type: string, nullable: true }
        id_tag: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time, nullable: true }
        stop_reason: { type: string, nullable: true }
        status:
          type: string
          enum: [active, completed]
        duration_seconds: { type: integer, format: int32 }

    SessionList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'

    # -------- Metrics Schemas --------
    MetricsSummary:
      type: object
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date-time, nullable: true }
            to: { type: string, format: date-time, nullable: true }
        total_charge_points: { type: integer }
        active_charge_points: { type: integer }
        availability_pct: { type: number, format: double }
        sessions_active: { type: integer }
        energy_kwh: { type: number, format: double }
        revenue:
          type: number
          format: double
          description: Receita (BRL)
        success_rate_pct: { type: number, format: double }

    MetricsAdvanced:
      type: object
      properties:
        sessions_by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              sessions: { type: integer }
        energy_by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              kwh: { type: number, format: double }
        revenue_by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              amount: { type: number, format: double }

    # -------- Tariffs Schemas --------
    TariffSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status:
          type: string
          enum: [active, draft, archived]
        currency: { type: string, example: BRL }
        energy_price_per_kwh: { type: number, format: double }
        created_at: { type: string, format: date-time }

    Tariff:
      allOf:
        - $ref: '#/components/schemas/TariffSummary'
        - type: object
          properties:
            start_fee: { type: number, format: double, nullable: true }
            idle_fee_per_minute: { type: number, format: double, nullable: true }
            updated_at: { type: string, format: date-time }

    TariffUpsert:
      type: object
      properties:
        name: { type: string }
        status:
          type: string
          enum: [active, draft, archived]
        currency: { type: string, example: BRL }
        energy_price_per_kwh: { type: number, format: double }
        start_fee: { type: number, format: double, nullable: true }
        idle_fee_per_minute: { type: number, format: double, nullable: true }
      required: [name, status, currency, energy_price_per_kwh]

    TariffPreviewRequest:
      type: object
      properties:
        tariff_id: { type: integer, format: int64, nullable: true }
        charge_box_id: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time, nullable: true }
        energy_kwh: { type: number, format: double }
        duration_seconds: { type: integer, format: int32 }
        idle_seconds: { type: integer, format: int32, nullable: true }
      required: [started_at, energy_kwh, duration_seconds]

    TariffPreviewResponse:
      type: object
      properties:
        currency: { type: string, example: BRL }
        total_amount: { type: number, format: double }
        breakdown:
          type: object
          properties:
            energy_cost: { type: number, format: double }
            start_fee: { type: number, format: double, nullable: true }
            idle_cost: { type: number, format: double, nullable: true }

    # -------- Billing Schemas --------
    InvoiceSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status:
          type: string
          enum: [issued, paid, cancelled]
        amount: { type: number, format: double }
        currency: { type: string, example: BRL }
        issued_at: { type: string, format: date-time }

    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceSummary'
        - type: object
          properties:
            session_transaction_id: { type: integer, format: int32, nullable: true }
            charge_box_id: { type: string, nullable: true }
            id_tag: { type: string, nullable: true }
            energy_kwh: { type: number, format: double, nullable: true }
            due_at: { type: string, format: date-time, nullable: true }
            paid_at: { type: string, format: date-time, nullable: true }
            metadata:
              type: object
              additionalProperties: true
